name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        # Replaces the stale jetli/wasm-pack-action (Node 20, no newer release)
        # with the official prebuilt-binary installer.
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install deps
        run: npm ci

      # The FROST protocol itself lives in the Rust crate, and its tests are
      # the only thing that checks it: 2-of-3 / 3-of-5 / 5-of-5 pipelines,
      # under-threshold aggregation failing, a wrong commitment list being
      # rejected, tampered messages not verifying, distinct subsets producing
      # distinct valid signatures, and the output verifying against an
      # independent ed25519 verifier. No npm script runs them, so before this
      # step nothing in CI or deploy did — a crate whose threshold signing was
      # broken compiled to WASM and published.
      - name: Crate tests (FROST protocol)
        run: cargo test --manifest-path crate/Cargo.toml

      - name: Build WASM
        run: npm run wasm

      # The vitest suite over the attack exhibits. Deploy previously ran only
      # test:a11y, so this never gated a publish either.
      - name: Unit tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Accessibility gate (axe-core, WCAG A/AA)
        run: npm run test:a11y

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
