name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        # Pinned prebuilt binary, downloaded to a FILE and checksum-verified
        # before anything is extracted or executed. Keeps this lab's choice of
        # the official prebuilt binary over jetli/wasm-pack-action (stale,
        # Node 20, no newer release) -- it only stops trusting a mutable URL.
        #
        # THE OLD STEP REPORTED SUCCESS WHEN IT FAILED. It was
        # `curl … init.sh -sSf | sh`, and GitHub runs `run:` under `bash -e`
        # with no `pipefail`, so the pipeline's status was `sh`'s: a failed
        # download left `sh` reading empty stdin and exiting 0, the step went
        # green with nothing installed, and the build then died downstream at
        # `npm run wasm` with `command not found` -- an error that points at
        # the artefact instead of the installer. Verified locally:
        # `bash -e -c 'curl -sSf <404> | sh'` exits 0.
        #
        # It also pinned nothing. The hosted init.sh hardcodes v0.13.1, so the
        # version came from rustwasm's web server rather than from this repo,
        # and v0.13.1 is OLDER than the version its siblings were moved to --
        # ablation-wire v0.15.0 and silent-tally v0.15.1 -- both pinned to get
        # a bundled wasm-opt that can parse the externref table that
        # reference-types support emits ("Only 1 table definition allowed in
        # MVP"). This crate builds wasm32-unknown-unknown with wasm-bindgen
        # 0.2, so it was one `cargo update` from that failure.
        #
        # v0.15.1 matches crypto-lab-silent-tally, read from its
        # .github/workflows/deploy.yml line 68 and test.yml line 47.
        # SHA-256 computed 2026-11-16 from the official release asset
        # https://github.com/rustwasm/wasm-pack/releases/download/v0.15.1/wasm-pack-v0.15.1-x86_64-unknown-linux-musl.tar.gz
        # (2886204 bytes). $HOME/.cargo/bin is where `npm run wasm` looks:
        # its script is `PATH=$HOME/.cargo/bin:$PATH wasm-pack build crate …`.
        run: |
          set -euo pipefail
          version=0.15.1
          asset="wasm-pack-v${version}-x86_64-unknown-linux-musl"
          sha256=410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2
          curl --fail --location --silent --show-error \
            -o "${asset}.tar.gz" \
            "https://github.com/rustwasm/wasm-pack/releases/download/v${version}/${asset}.tar.gz"
          echo "${sha256}  ${asset}.tar.gz" | sha256sum -c -
          tar -xzf "${asset}.tar.gz"
          mkdir -p "$HOME/.cargo/bin"
          install -m 0755 "${asset}/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          rm -rf "${asset}" "${asset}.tar.gz"
          # The step fails unless the installed binary reports exactly this
          # version, so a wrong or missing binary cannot pass silently.
          actual="$("$HOME/.cargo/bin/wasm-pack" --version)"
          echo "wasm-pack --version: ${actual}"
          if [ "${actual}" != "wasm-pack ${version}" ]; then
            echo "::error::expected 'wasm-pack ${version}', got '${actual}'"
            exit 1
          fi

      - name: Install deps
        run: npm ci

      # The FROST protocol itself lives in the Rust crate, and its tests are
      # the only thing that checks it: 2-of-3 / 3-of-5 / 5-of-5 pipelines,
      # under-threshold aggregation failing, a wrong commitment list being
      # rejected, tampered messages not verifying, distinct subsets producing
      # distinct valid signatures, and the output verifying against an
      # independent ed25519 verifier. No npm script runs them, so before this
      # step nothing in CI or deploy did — a crate whose threshold signing was
      # broken compiled to WASM and published.
      - name: Crate tests (FROST protocol)
        run: cargo test --manifest-path crate/Cargo.toml

      - name: Build WASM
        run: npm run wasm

      # The vitest suite over the attack exhibits. Deploy previously ran only
      # test:a11y, so this never gated a publish either.
      - name: Unit tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Accessibility gate (axe-core, WCAG A/AA)
        run: npm run test:a11y

      - name: Replay accountable source mutations
        run: npm run test:mutations

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot only. Runs after the gate above, so a bump can only merge itself
  # if this lab's own tests, build and axe/e2e run went green on the PR.
  # Majors are deliberately excluded -- the 2026-08-18 batch had to hold back 109
  # bumps and they were overwhelmingly majors (@noble v2 dropped export subpaths,
  # TypeScript 7, vitest 4), so those still want a human.
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write   # required by the deploy dispatch; without it gh workflow run 403s
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      # Majors wait for a human. `needs:` above already required the whole gate
      # to pass, and that gate judges whether a bump works far better than its
      # version number does -- but a green gate is not consent to a breaking
      # change, so a semver-major is left open for someone to look at. Minor and
      # patch still merge themselves.
      - name: Merge any bump whose gate went green
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::deploy dispatch failed; run deploy.yml by hand"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
